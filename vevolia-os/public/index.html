<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vevolia OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one cream page, a black tab rail on the left (a tab bar on phones), one simple page at a time. Pastel cards for the numbers that matter. */
:root{
  color-scheme:light;
  --bg:#f7f1e3; --card:#ece5d5; --card2:#e3dbc8; --white:#fffdf8; --ink:#141414; --muted:#6e675a; --line:#dcd2bd;
  --pink:#f5b8d8; --pink2:#e57cb4; --yellow:#f6d86b; --blue:#b4c8ef; --olive:#a3b06b; --green:#a9c97a; --red:#c2413b;
  --font:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--pink2);outline-offset:2px}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
/* tab rail */
.rail{background:var(--ink);color:#f2eee6;padding:24px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:24px;letter-spacing:-.02em;padding:0 12px;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--pink)}
.tabs{display:flex;flex-direction:column;gap:4px}
.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:15px;font-weight:500;color:#d8d3c8}
.tab svg{width:20px;height:20px;flex:none}
.tab:hover{background:#262626;color:#fff}
.tab[aria-current="page"]{background:var(--pink);color:var(--ink);font-weight:700}
.tab:focus-visible{outline:2.5px solid var(--pink)}
.tab .n{margin-left:auto;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.railfoot{margin-top:auto;padding:0 12px;font-size:12px;color:#9b958a}
.railfoot a{color:#f2eee6}
/* page */
.main{min-width:0;padding-block:32px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
@media (min-width:861px){.main{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{font-size:34px;font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:12px}
/* buttons */
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{background:#333}
.btn.light{background:var(--card);color:var(--ink)}
.btn.light:hover{background:var(--card2)}
.btn.small{padding:6px 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:4px 0;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;background:var(--card);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chip:hover{background:var(--card2)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--white);white-space:nowrap}
.tag.pink{background:var(--pink)} .tag.yellow{background:var(--yellow)} .tag.blue{background:var(--blue)} .tag.olive{background:var(--olive)} .tag.green{background:var(--green)} .tag.red{background:var(--red);color:#fff} .tag.dark{background:var(--ink);color:#fff}
/* big number cards */
.cards{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.cards.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border-radius:24px;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:150px}
.card>*{position:relative;z-index:1}
.card .shape{position:absolute;z-index:0;pointer-events:none}
.card.pink{background:var(--pink)} .card.yellow{background:var(--yellow)} .card.blue{background:var(--blue)} .card.olive{background:var(--olive)} .card.plain{background:var(--card)}
.card .label{font-size:14px;font-weight:600}
.card .big{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.card .note{font-size:13px;margin-top:auto}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px;min-width:4px}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px 14px}
.item.late{background:#f6dfe8}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--white);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.check:hover{background:var(--green)}
.check svg{width:16px;height:16px;opacity:0}
.check:hover svg,.check.on svg{opacity:1}
.check.on{background:var(--ink);color:#fff}
.item .open{all:unset;cursor:pointer;min-width:0;display:flex;flex-direction:column}
.item .open:focus-visible{outline:2.5px solid var(--pink2);border-radius:6px}
.item .t{font-weight:600;line-height:1.3}
.item .s{font-size:13px;color:var(--muted)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:20px;padding:24px;text-align:center;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.box{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.callout{border-radius:18px;padding:14px 18px;background:var(--yellow);font-size:14px}
.callout.blue{background:var(--blue)} .callout.pink{background:var(--pink)} .callout.green{background:var(--green)}
/* board */
.board{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.col{background:var(--card);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col .item{background:var(--white)}
.col h2{font-size:16px;padding:4px 6px;display:flex;justify-content:space-between}
/* tables */
.tw{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:20px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#faf6ec}
/* plan inputs */
.inputs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.inp{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.inp label{font-size:13px;font-weight:600}
.inp .help{font-size:12px;color:var(--muted)}
.inp input{border:0;background:var(--white);border-radius:12px;padding:9px 12px;font-weight:600;font-size:16px;width:100%;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
/* testing */
.rules{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.rule{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px 16px}
.dot{width:14px;height:14px;border-radius:50%}
.dot.ok{background:#5f9a3a} .dot.bad{background:var(--pink2)}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.step{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:12px;color:var(--muted);min-width:0}
.step i{height:10px;border-radius:999px;background:var(--white);border:1px solid var(--line)}
.step.done i{background:var(--ink);border-color:var(--ink)}
.step.now i{background:var(--pink2);border-color:var(--pink2)}
.step.done,.step.now{color:var(--ink);font-weight:600}
.step:disabled{cursor:default}
/* accordion */
details.acc{background:var(--card);border-radius:18px}
details.acc summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:20px;line-height:1}
details.acc[open] summary::after{content:"–"}
details.acc .body{padding:0 18px 16px;white-space:pre-wrap;max-width:75ch}
/* form sheet */
.ov{position:fixed;inset:0;background:rgba(20,16,8,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));z-index:50;overflow:auto}
.sheet.wide{width:min(760px,100%)}
.flag{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.flag:last-child{border-bottom:0}
.sheet{background:var(--bg);border-radius:26px;width:min(560px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.fgrid .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.sheet input,.sheet select,.sheet textarea,.search{width:100%;border:1px solid var(--line);background:var(--white);border-radius:12px;padding:10px 12px;font-size:15px}
.sheet textarea{min-height:90px;resize:vertical}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:60}
.ro .writeonly{display:none!important}
.fade{animation:fade .2s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;z-index:20;display:block;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));padding-top:max(8px,env(safe-area-inset-top,0px))}
  .logo{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .tab{flex-direction:column;gap:2px;padding:6px 2px;font-size:12px;text-align:center;justify-content:center;border-radius:10px}
  .tab svg{width:18px;height:18px}.tab .n{display:none}
  .railfoot{display:none}
  .main{padding-block:22px 60px}
  h1{font-size:28px}
  .board,.rules,.cards.three{grid-template-columns:1fr!important}
  .steps span{display:none}
}
@media (max-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:120px;padding:14px;border-radius:20px}.card .big{font-size:24px}.card .label,.card .note{font-size:12px}.card .shape{transform:scale(.7);transform-origin:top right}.cards.three .card:last-child:nth-child(odd){grid-column:1/-1}}
</style>
</head>
<body>
<script src="/shim.js"></script>


<div class="app" id="app">
  <aside class="rail">
    <div class="logo">vevolia<i></i></div>
    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <div class="railfoot"><a href="https://claude.ai/artifact/H3YdcfpjJ2p8vS415pgfAw" target="_blank" rel="noopener">Live store numbers ↗</a><br><a href="#" onclick="vosLogout();return false">Log out</a></div>
  </aside>
  <main class="main"><div class="page" id="view"><div class="empty">Loading…</div></div></main>
</div>

<script>
(() => {
/* ---------- icons ---------- */
const P = {
  home: '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  ads: '<path d="M4 10v4a1 1 0 0 0 1 1h2l6 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6"/>',
  money: '<circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.3c-.5-.8-1.4-1.3-2.5-1.3-1.5 0-2.5.8-2.5 2s1 1.6 2.5 2 2.5.9 2.5 2-1 2-2.5 2c-1.1 0-2-.5-2.5-1.3M12 6.5v11"/>',
  test: '<path d="M9 3h6M10 3v6l-5.5 9.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7.5 15h9"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/>',
  doc: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  note: '<path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1z"/>',
  spark: '<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>',
};
const icon = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- tabs ---------- */
const TABS = [['home', 'Home', 'home'], ['tasks', 'Tasks', 'check'], ['ads', 'Ads', 'ads'], ['creative', 'Creative', 'spark'], ['money', 'Money', 'money'], ['testing', 'Testing', 'test'], ['rules', 'Rules', 'book'], ['docs', 'Docs', 'doc'], ['notes', 'Notes', 'note']];
const NUMBERS_URL = 'https://claude.ai/artifact/H3YdcfpjJ2p8vS415pgfAw';
const S = { tab: 'home', db: null, canWrite: true, loaded: false, data: { scorecard: [], ads: [], tasks: [], sops: [], docs: [], memory: [], intel: [], spins: [], research: [], scripts: [] }, plan: null, os: null,
  f: { tasks: 'All', ads: 'All', notes: 'All', docs: '', cview: 'Research', csrc: 'All' }, lastTab: null, mcp: null, meta: { state: 'idle' }, shop: { state: 'idle' } };
try { const t = localStorage.getItem('vos-tab2'); if (t && TABS.some(x => x[0] === t)) S.tab = t; } catch (e) {}
const hash = location.hash.slice(1); if (TABS.some(x => x[0] === hash)) S.tab = hash;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (k === 'text') n.textContent = v; else n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const money = (v, d = 0) => v == null || !isFinite(v) ? '—' : (v < 0 ? '−' : '') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const num = (v, d = 0) => v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = (v, d = 0) => v == null || !isFinite(v) ? '—' : (v * 100).toFixed(d) + '%';
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => iso(new Date());
const parse = (s) => new Date(s + 'T00:00:00');
const addDays = (s, n) => { const x = parse(s); x.setDate(x.getDate() + n); return iso(x); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const nice = (s) => { if (!s) return ''; const t = today(); if (s === t) return 'Today'; if (s === addDays(t, 1)) return 'Tomorrow'; if (s === addDays(t, -1)) return 'Yesterday'; return parse(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
const mondayOf = (s) => { const x = parse(s); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return iso(x); };
const toast = (m) => { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = el('div', { class: 'toast', role: 'status', text: m }); document.body.append(t); setTimeout(() => t.remove(), 1800); };
const SHAPES = {
  heart: '<svg class="shape" style="right:-8px;top:-8px;width:100px" viewBox="0 0 100 100"><path d="M50 88S8 62 8 34a21 21 0 0 1 42-6 21 21 0 0 1 42 6c0 28-42 54-42 54z" fill="#e57cb4" opacity=".45"/></svg>',
  cross: '<svg class="shape" style="right:-14px;top:-12px;width:100px" viewBox="0 0 100 100"><path d="M38 0h24v38h38v24H62v38H38V62H0V38h38z" fill="#e9c13d" opacity=".6" transform="rotate(14 50 50)"/></svg>',
  star: '<svg class="shape" style="right:-18px;bottom:-24px;width:110px" viewBox="0 0 100 100"><path d="M50 0l10 30 30-12-14 28 24 18-30 6 4 30-24-18-24 18 4-30-30-6 24-18L10 18l30 12z" fill="#7d99d6" opacity=".6"/></svg>',
  tri: '<svg class="shape" style="right:8px;bottom:-30px;width:120px" viewBox="0 0 100 100"><path d="M0 8h100L48 98z" fill="#7f8c46" opacity=".5"/></svg>',
};
const card = (color, shape, label, big, note, extra) => { const c = el('div', { class: 'card ' + color }); if (shape) c.insertAdjacentHTML('afterbegin', SHAPES[shape]); c.append(el('div', { class: 'label' }, label), el('div', { class: 'big' }, big)); if (extra) c.append(extra); if (note) c.append(el('div', { class: 'note' }, note)); return c; };
const head = (title, sub, ...actions) => el('div', { class: 'head' }, el('div', {}, el('h1', {}, title), sub ? el('p', { class: 'sub' }, sub) : null), actions.length ? el('div', { class: 'row' }, ...actions) : null);
const OPEN = new Set();
const acc = (key, summary, ...body) => { const d = el('details', { class: 'acc', 'data-key': key, open: OPEN.has(key) || null }, el('summary', {}, summary), ...body); d.addEventListener('toggle', () => { d.open ? OPEN.add(key) : OPEN.delete(key); }); return d; };
const addBtn = (label, onclick) => el('button', { class: 'btn writeonly', type: 'button', onclick }, '+ ' + label);

/* ---------- forms ---------- */
const OWNERS = ['Kayy', 'Saamir', 'Editor', 'Both'];
const SCHEMA = {

          el('td', {}, el('b', {}, nice(r.week))), el('td', { class: 'n' }, money(r.revenue)), el('td', { class: 'n' }, num(r.orders)), el('td', { class: 'n' }, money(r.spend, 2)), el('td', { class: 'n' }, r.orders ? money(r.spend / r.orders, 2) : '—'), el('td', { class: 'small', style: 'min-width:220px' }, r.notes || '')))))) : el('div', { class: 'empty' }, 'No weeks yet. Every Monday, add last week’s numbers.'))];

const STEPS = ['Check the money math', 'Find a supplier', 'Write the plan (MAD)', 'Set up store and ads account', 'Make the first ads', 'Launch', 'Make more ads from results'];
function pageTesting() {

    el('div', { class: 'rules' },

}

/* ---------- shell ---------- */
const PAGES = { home: pageHome, tasks: pageTasks, ads: pageAds, creative: pageCreative, money: pageMoney, testing: pageTesting, rules: pageRules, docs: pageDocs, notes: pageNotes };
const COUNT = { tasks: () => openTasks().length, creative: () => S.data.research.filter(r => r.status === 'New').length };
function go(tab) { S.tab = tab; try { localStorage.setItem('vos-tab2', tab); } catch (e) {} render(); window.scrollTo(0, 0); const cur = $('.tab[aria-current="page"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }

(async () => {

  S.loaded = true; S.db = db; S.mcp = mcp; S.sample = sample;
  if (!db) { render(); return; }
  if (user && user.can) { try { if (await user.can('data.write') === false) { S.canWrite = false; $('#app').classList.add('ro'); } } catch (e) {} }
  for (const coll of Object.keys(S.data)) db.collection(coll).onSnapshot((snap) => { S.data[coll] = snap.docs.map(d => ({ id: d.id, ...d.data() })); later(); }, () => {});
